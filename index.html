<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier d'achat</title>
</head>
<body>
    <h1>ACHAT</h1>
    <input type="text" id="input" placeholder="Écris un produit">
    <div class="boul">
        <button id="btnAdd">Ajouter</button>
        <button id="btnSup">Supprimer tout</button>
    </div>
    <ul id="list"></ul>
    <script>
        // 1. Récupération des éléments HTML
        const input = document.getElementById("input");
        const btnAdd = document.getElementById("btnAdd");
        const btnSup = document.getElementById("btnSup");
        const list = document.getElementById("list");
        // 2. Écouter le clic sur Ajouter
        btnAdd.addEventListener("click", () => {
            // On récupère la valeur actuelle de l'input
            const produit = input.value.trim();
            // Vérifier si le champ est vide
            if (produit === "") {
                alert("Aucun produit saisi");
                return;
            }
            // 3. Vérifier si le produit existe déjà
            const panier = list.children;
            for (let i = 0; i < panier.length; i++) {
                if (panier[i].textContent.toLowerCase() === produit.toLowerCase()) {
                    alert("Produit déjà ajouté");
                    return;
                }
            }
            // 4. Créer un nouvel élément HTML
            const li = document.createElement("li");
            // Ajouter le nom du produit dans le li
            li.textContent = produit;
            // Ajouter le li dans la liste ul
            list.appendChild(li);
            // Vider le champ après l'ajout
            input.value = "";
        });
        // 5. Supprimer tous les produits
        btnSup.addEventListener("click", () => {
            list.innerHTML = "";
        });
    </script>
</body>
</html>
