<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des produits</title>
</head>

    <h1>Gestion des produits</h1>

            <tr>
                <th>ID</th>

                <th>CATEGORIE</th>

                <th>DISPONIBLE</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>

        // ==================================================
        // 1. TABLEAU D'OBJETS
        // ==================================================

        // Un tableau contient plusieurs objets.
        // Chaque objet représente un produit.

        const produits = [
            {
                id: 1,
                nom: "Riz",
                categorie: "Alimentaire",
                prix: 15000,
                stock: 10,
                disponible: true
            },
            {
                id: 2,
                nom: "Savon",
                categorie: "Hygiène",
                prix: 500,
                stock: 0,
                disponible: false
            }
        ];


        // ==================================================
        // 2. SÉLECTION DU DOM
        // ==================================================

        // Fonction personnalisée pour simplifier querySelector.

        function $(element) { return document.querySelector(element); }

        const input = $("#recherche");
        const tbody = $("#tbody");


        // ==================================================
        // 3. AFFICHER LES PRODUITS : forEach()
        // ==================================================
        function afficherProduits(liste) {
            // Vider le tableau HTML avant de le remplir.
            tbody.innerHTML = "";
            // Parcourir chaque produit de la liste.
            liste.forEach(function(produit) {
                // Créer une nouvelle ligne HTML.
                const ligne = document.createElement("tr");

                // Ajouter les cellules dans la ligne.
                ligne.innerHTML = `
                    <td>${produit.id}</td>
                    <td>${produit.nom}</td>
                    <td>${produit.categorie}</td>
                    <td>${produit.prix}</td>
                    <td>${produit.stock}</td>
                    <td>${produit.disponible}</td>
                `;
                // Insérer la ligne dans le tableau HTML.
                tbody.appendChild(ligne);
            });
        }

        // Affichage initial.
        afficherProduits(produits);

        // ==================================================
        // 4. FIND : CHERCHER UN PRODUIT
        // ==================================================
        $("#btnRecherche").addEventListener("click", function() {
            const nom = input.value.trim();
            // find() retourne le premier objet correspondant.
            // Retourne undefined si aucun produit n'est trouvé.
            // const produit = produits.find(function(p) {
            //     return p.nom.toLowerCase() === nom.toLowerCase();
            // });
            const produit = produits.find((p) => p.nom.toLowerCase() === nom.toLowerCase());
            // Afficher le produit trouvé ou une liste vide.
            if (produit) {
                afficherProduits([produit]);
            } else {
                afficherProduits([]);
            }
        });
        // ==================================================
        // 5. AFFICHER TOUS LES PRODUITS
        // ==================================================
        $("#btnTous").addEventListener("click", function() {
            afficherProduits(produits);
        });


        // ==================================================
        // 6. MAP : TRANSFORMER UN TABLEAU
        // ==================================================
        // Extraire uniquement les noms des produits.
        // map() retourne un nouveau tableau.
        const noms = produits.map(function(produit) { return produit.nom; });

        // ==================================================
        // 7. FILTER : FILTRER UN TABLEAU
        // ==================================================
        // Récupérer uniquement les produits disponibles.
        const disponibles = produits.filter((produit) => {
            return produit.disponible === true;
        });

        console.log("Disponibles :", disponibles);


        // ==================================================
        // 8. FINDINDEX : TROUVER UN INDEX
        // ==================================================

        const indexSavon = produits.findIndex((produit) => produit.nom === "Savon");
        console.log("Index du savon :", indexSavon);


        // ==================================================
        // 9. PUSH : AJOUTER UN ÉLÉMENT
        // ==================================================
        // Ajouter un nouveau produit à la fin du tableau.
        produits.push({
            id: 3,
            nom: "Lait",
            categorie: "Alimentaire",
            prix: 1000,
            stock: 5,
            disponible: true
        });
        console.log("Après push :", produits);


        // ==================================================
        // 10. SPLICE : SUPPRIMER UN ÉLÉMENT
        // ==================================================
        // splice(index, nombre à supprimer)
        // Supprimer le savon à sa position initiale.
        if (indexSavon !== -1) produits.splice(indexSavon, 1);
        console.log("Après splice :", produits);


        // ==================================================
        // 11. SOME : AU MOINS UN ÉLÉMENT ?
        // ==================================================
        // Vérifier si au moins un produit coûte plus de 10000.
        const traitement = function(produit) {
            return produit.prix > 10000;
        }
        const produitCher = produits.some(traitement);
        console.log("Un produit coûte plus de 10000 ?", produitCher);


        // ==================================================
        // 12. EVERY : TOUS LES ÉLÉMENTS ?
        // ==================================================
        // Vérifier si tous les produits sont disponibles.
        function tous(produit) {
            return produit.disponible === true;
        }
        const tousDisponibles = produits.every(() => {
            return tous(produit)
        });
        console.log("Tous disponibles ?", tousDisponibles);


        // ==================================================
        // 13. SORT : TRIER UN TABLEAU
        // ==================================================
        // [...produits] crée une copie du tableau.
        // Cela évite de modifier le tableau original.
        const produitsTries = [...produits];
        // Trier les produits par prix croissant.
        produitsTries.sort(function(a, b) {
            return a.prix - b.prix;
        });
        console.log("Produits triés :", produitsTries);


        // ==================================================
        // 14. REDUCE : CALCULER UN TOTAL
        // ==================================================
        // Calculer la valeur totale du stock.
        // total représente l'accumulateur.
        // 0 représente sa valeur initiale.
        const valeurStock = produits.reduce(function(total, produit) {
            return total + (produit.prix * produit.stock);
        }, 0);
        console.log("Valeur totale du stock :", valeurStock, "FCFA");


        // ==================================================
        // 15. AUTRES MÉTHODES DE TABLEAUX
        // ==================================================
        const nombres = [10, 20, 30];
        // length : nombre d'éléments.
        console.log("Taille :", nombres.length);
        // includes : vérifier si une valeur existe.
        console.log("Contient 20 :", nombres.includes(20));
        // indexOf : récupérer la position d'une valeur.
        console.log("Position de 30 :", nombres.indexOf(30));
        // concat : fusionner deux tableaux.
        console.log("Fusion :", nombres.concat([40, 50]));
        // reverse : inverser l'ordre du tableau.
        console.log("Inversé :", [...nombres].reverse());
        // pop : supprimer le dernier élément.
        console.log("Supprimé :", nombres.pop());
        // unshift : ajouter au début.
        nombres.unshift(5);
        // shift : supprimer le premier élément.
        nombres.shift();
        console.log("Tableau final :", nombres);


        // ==================================================
        // 16. PARCOURIR UN TABLEAU ET UN OBJET
        // ==================================================
        const utilisateur = {
            nom: "Ali",
            age: 25
        };
        // for...of : parcourir les valeurs d'un tableau.
        for (const nombre of nombres) {
            console.log("Valeur :", nombre);
        }
        // for...in : parcourir les clés d'un objet.
        for (const cle in utilisateur) {
            console.log(cle, utilisateur[cle]);
        }
        // Object.keys : récupérer les clés.
        console.log(Object.keys(utilisateur));
        // Object.values : récupérer les valeurs.
        console.log(Object.values(utilisateur));
        // Object.entries : récupérer les paires clé/valeur.
        console.log(Object.entries(utilisateur));


        // ==================================================
        // 17. STRUCTURES IMBRIQUÉES
        // ==================================================
        // Un objet peut contenir un tableau d'objets.
        // Chaque objet peut lui-même contenir un tableau.
        const entreprise = {
            equipes: [
                {
                    nom: "Frontend",
                    membres: [
                        {
                            nom: "Alice",
                            competences: ["HTML", "JS"]
                        }
                    ]
                }
            ]
        };
        // Parcourir les équipes.
        for (const equipe of entreprise.equipes) {

                // Parcourir les compétences de chaque membre.
                for (const competence of membre.competences) {
                    console.log("Compétence :", competence);
                }
            }
        }


        // ==================================================
        // 18. MAP ET SET : STRUCTURES DE DONNÉES
        // ==================================================
        // Map : stocker des paires clé/valeur.
        const map = new Map();
        map.set("nom", "Alice");
        map.set("age", 25);
        console.log("Map :", map);
        console.log("Nom :", map.get("nom"));
        // Set : stocker des valeurs uniques.
        const set = new Set();
        set.add("Alice");
        set.add("Bob");
        set.add("Alice"); // Ignoré : valeur déjà présente.
        console.log("Set :", set);

    </script>

</body>
</html> -->

];

function calculerTotaux(liste) {
    // Additionner toutes les quantités en stock.
    const sommeStock = liste.reduce((total, produit) => {
        return total + produit.stock;
    }, 0);
    // Calculer la valeur totale du stock.
    const sommeMontant = liste.reduce((total, produit) => {
        return total + (produit.prix * produit.stock);
    }, 0);
    totalStock.textContent = `Total stock : ${sommeStock} produits`;
    montantTotal.textContent = `Valeur du stock : ${sommeMontant} FCFA`;
    nombreProduits.textContent = `Nombre de références : ${liste.length}`;
}


// ==================================================
// 6. AFFICHAGE GÉNÉRAL
// ==================================================
function actualiser(liste = produits) {
    afficherProduits(liste);
    calculerTotaux(liste);
    resultat.textContent =
        `Nombre de produits trouvés : ${liste.length}`;
}


// ==================================================
// 7. RECHERCHE ET FILTRAGE
// ==================================================

function filtrerProduits() {
    const recherche = search.value.trim().toLowerCase();
    const prixMini = mini.value === "" ? null : Number(mini.value);
    const prixMaxi = maxi.value === "" ? null : Number(maxi.value);
    const resultatFiltre = produits.filter(produit => {
        // Recherche sur plusieurs propriétés.
        const correspondRecherche =
            produit.id.toString().includes(recherche) ||
            produit.nom.toLowerCase().includes(recherche) ||
            produit.categorie.toLowerCase().includes(recherche) ||
            produit.prix.toString().includes(recherche) ||
            produit.stock.toString().includes(recherche) ||
            (produit.disponible ? "disponible" : "non disponible").includes(recherche);
        // Filtre par prix minimum.
        const correspondMini =
            prixMini === null || produit.prix >= prixMini;
        // Filtre par prix maximum.
        const correspondMaxi =
            prixMaxi === null || produit.prix <= prixMaxi;
        return correspondRecherche && correspondMini && correspondMaxi;
    });
    actualiser(resultatFiltre);
}
// Écouter les trois champs.
search.addEventListener("input", filtrerProduits);
mini.addEventListener("input", filtrerProduits);
maxi.addEventListener("input", filtrerProduits);


// ==================================================
// 8. TRIER LES PRODUITS
// ==================================================
function trier(propriete) {
    produits.sort((a, b) => {
        let resultat;
        if (propriete === "nom" || propriete === "categorie") {
            resultat = a[propriete].localeCompare(b[propriete]);
        }
        else if (propriete === "disponible") {
            resultat = Number(a.disponible) - Number(b.disponible);
        }
        else {
            resultat = a[propriete] - b[propriete];
        }
        return ordreCroissant ? resultat : -resultat;
    });
    ordreCroissant = !ordreCroissant;
    filtrerProduits();
}
// Récupérer tous les titres du tableau.
const titres = document.querySelectorAll("th[data-sort]");
titres.forEach(titre => {
    titre.addEventListener("click", () => {
        trier(titre.dataset.sort);
    });
});

btnAdd.textContent = "+ Ajouter un produit";
btnAdd.className = "btn-add";

            </select>
        </td>

        <td>
            <button class="btn-add" data-action="valider">Ajouter</button>

            <button class="btn-cancel" data-action="annuler">Annuler</button>
        </td>
    `;
    tbody.prepend(ligne);
});


// ==================================================
// 10. GESTION DES ACTIONS DU TABLEAU
// ==================================================
// Délégation d'événements : un seul écouteur pour les boutons
// Ajouter, Annuler, Modifier et Supprimer.
tbody.addEventListener("click", (event) => {
    const bouton = event.target.closest("button");
    if (!bouton) return;
    const action = bouton.dataset.action;
    const ligne = bouton.closest("tr");
    // ----------------------------------------------
    // ANNULER L'AJOUT
    // ----------------------------------------------
    if (action === "annuler") {
        ligne.remove();
        ajoutEnCours = false;
        return;
    }
    // ----------------------------------------------
    // VALIDER L'AJOUT
    // ----------------------------------------------
    if (action === "valider") {
        const nom = ligne.querySelector(".nom").value.trim();
        const categorie = ligne.querySelector(".categorie").value.trim();
        const prix = ligne.querySelector(".prix").value;
        const stock = ligne.querySelector(".stock").value;
        const disponible = ligne.querySelector(".disponible").value;
        // Validation des champs.
        if (!nom || !categorie || prix === "" || stock === "") {
            alert("Tous les champs sont obligatoires.");
            return;
        }
        // Vérifier les valeurs numériques.
        if (!Number.isFinite(Number(prix)) ||
            !Number.isFinite(Number(stock)) ||
            Number(prix) < 0 ||
            Number(stock) < 0) {
            alert("Les valeurs doivent être positives.");
            return;
        }
        // Générer un nouvel identifiant.
        const nouvelId = Math.max(0, ...produits.map(p => p.id)) + 1;
        // Construire le nouvel objet.
        const nouveauProduit = {
            id: nouvelId,
            nom: nom,
            categorie: categorie,
            prix: Number(prix),
            stock: Number(stock),
            disponible: stock === "0" ? false : disponible === "true"
        };
        // Ajouter au début du tableau.
        produits.unshift(nouveauProduit);
        ajoutEnCours = false;
        filtrerProduits();
        return;
    }
    // ----------------------------------------------
    // SUPPRIMER UN PRODUIT
    // ----------------------------------------------
    if (action === "supprimer") {
        const id = Number(ligne.dataset.id);
        if (!confirm("Voulez-vous vraiment supprimer ce produit ?")) {
            return;
        }
        // Animation de suppression.
        ligne.classList.add("delete-animation");
        ligne.addEventListener("transitionend", () => {
            // Trouver la position du produit.
            const index = produits.findIndex(produit => produit.id === id);
            // Supprimer du tableau.
            if (index !== -1) {
                produits.splice(index, 1);
            }
            filtrerProduits();
        }, { once: true });
        return;
    }
    // ----------------------------------------------
    // MODIFIER UN PRODUIT
    // ----------------------------------------------
    if (action === "modifier") {
        const id = Number(ligne.dataset.id);
        const produit = produits.find(p => p.id === id);
        if (!produit) return;
        // Transformer les cellules en champs.
        ligne.innerHTML = `
            <td>${produit.id}</td>
            <td>
                <input class="form-input nom" value="${produit.nom}">
            </td>
            <td>
                <input class="form-input categorie" value="${produit.categorie}">
            </td>
            <td>
                <input type="number" class="form-input prix" value="${produit.prix}" min="0">
            </td>
            <td>
                <input type="number" class="form-input stock" value="${produit.stock}" min="0">
            </td>
            <td>
                <select class="form-input disponible">
                    <option value="true" ${produit.disponible ? "selected" : ""}>
                        Disponible
                    </option>
                    <option value="false" ${!produit.disponible ? "selected" : ""}>
                        Non disponible
                    </option>
                </select>
            </td>
            <td>--</td>
            <td>
                <button class="btn-add" data-action="enregistrer">
                    Enregistrer
                </button>
                <button class="btn-cancel" data-action="annuler-modification">
                    Annuler
                </button>
            </td>
        `;
        // Conserver les valeurs originales pour annuler.
        ligne.dataset.modification = JSON.stringify(produit);
        return;
    }
    // ----------------------------------------------
    // ANNULER LA MODIFICATION
    // ----------------------------------------------
    if (action === "annuler-modification") {
        const original = JSON.parse(ligne.dataset.modification);
        Object.assign(
            produits.find(p => p.id === original.id),
            original
        );
        filtrerProduits();
        return;
    }
    // ----------------------------------------------
    // ENREGISTRER LA MODIFICATION
    // ----------------------------------------------
    if (action === "enregistrer") {
        const id = Number(ligne.dataset.id);
        const produit = produits.find(p => p.id === id);
        if (!produit) return;
        const nom = ligne.querySelector(".nom").value.trim();
        const categorie = ligne.querySelector(".categorie").value.trim();
        const prix = ligne.querySelector(".prix").value;
        const stock = ligne.querySelector(".stock").value;
        const disponible = ligne.querySelector(".disponible").value;
        if (!nom || !categorie || prix === "" || stock === "") {
            alert("Tous les champs sont obligatoires.");
            return;
        }
        if (!Number.isFinite(Number(prix)) ||
            !Number.isFinite(Number(stock)) ||
            Number(prix) < 0 ||
            Number(stock) < 0) {
            alert("Les valeurs doivent être positives.");
            return;
        }
        // Modifier les propriétés de l'objet existant.
        produit.nom = nom;
        produit.categorie = categorie;
        produit.prix = Number(prix);
        produit.stock = Number(stock);
        produit.disponible =
            stock === "0" ? false : disponible === "true";
        filtrerProduits();
    }
});


// ==================================================
// 11. AFFICHAGE INITIAL
// ==================================================
actualiser(produits);
</script>

</body>

    data.clavier.forEach(function(lettre, indexLettre) {
        const bouton = document.createElement("button");
        bouton.type = "button";
        bouton.className = "btn";
        bouton.textContent = lettre;
        bouton.dataset.index = indexLettre;
        clavier.appendChild(bouton);
    });
    // Cacher le bouton suivant
    zoneSuivante.style.display = "none";
}


/* =====================================================
   5. TROUVER LA PREMIÈRE CASE VIDE
===================================================== */
function premiereCaseVide() {
    const cases = document.querySelectorAll(".lettre");
    for (let i = 0; i < cases.length; i++) {
        if (cases[i].textContent === "_") {
            return i;
        }
    }
    return -1;
}


/* =====================================================
   6. AFFICHER UNE LETTRE
===================================================== */

function choisirLettre(bouton) {
    if (verificationEnCours || bouton.disabled) {
        return;
    }
    const indexCase = premiereCaseVide();
    // Toutes les cases sont remplies
    if (indexCase === -1) {
        return;
    }
    const lettre = bouton.textContent;
    const cases = document.querySelectorAll(".lettre");
    // Placer la lettre dans la première case vide
    cases[indexCase].textContent = lettre;
    cases[indexCase].style.backgroundColor = "#333";
    cases[indexCase].style.color = "white";
    // Mémoriser la lettre et le bouton utilisé
    reponseJoueur.push({
        lettre: lettre,
        bouton: bouton
    });
    // Désactiver le bouton utilisé
    bouton.disabled = true;
    // Vérifier la réponse
    verifierMot();
}


/* =====================================================
   7. VÉRIFIER LE MOT
===================================================== */
function verifierMot() {
    const data = niveaux[niveauCourant];
    const motJoueur = reponseJoueur
        .map(function(item) {
            return item.lettre;
        })
        .join("");
    // Attendre que toutes les lettres soient choisies
    if (motJoueur.length !== data.mot.length) {
        return;
    }
    const cases = document.querySelectorAll(".lettre");
    if (motJoueur === data.mot) {
        verificationEnCours = true;
        // Bonne réponse : afficher en vert
        cases.forEach(function(caseLettre) {
            caseLettre.classList.add("succes");
        });
        // Désactiver tout le clavier
        document.querySelectorAll(".btn").forEach(function(btn) {
            btn.disabled = true;
        });
        // Afficher le bouton suivant
        if (niveauCourant < niveaux.length - 1) {
            zoneSuivante.style.display = "block";
        } else {
            alert("Bravo ! Vous avez terminé tous les niveaux !");
        }
    } else {
        verificationEnCours = true;
        // Mauvaise réponse : afficher en rouge
        cases.forEach(function(caseLettre) {
            caseLettre.classList.add("erreur");
        });
        // Vider les cases après un court délai
        setTimeout(function() {
            viderCases();
        }, 600);
    }
}


/* =====================================================
   8. RETIRER UNE LETTRE D'UNE CASE
===================================================== */
function retirerLettre(indexCase) {
    if (verificationEnCours) {
        return;
    }
    const cases = document.querySelectorAll(".lettre");
    // Récupérer la lettre choisie à cette position
    const indexChoix = reponseJoueur.findIndex(function(item, index) {
        return index === indexCase;
    });
    if (indexChoix === -1) {
        return;
    }
    // Réactiver le bouton du clavier correspondant
    const choix = reponseJoueur[indexChoix];
    choix.bouton.disabled = false;
    // Retirer le choix et reconstruire les cases
    reponseJoueur.splice(indexChoix, 1);
    cases.forEach(function(caseLettre, index) {
        caseLettre.textContent =
            reponseJoueur[index]
                ? reponseJoueur[index].lettre
                : "_";
        caseLettre.classList.remove("erreur", "succes");

        caseLettre.style.backgroundColor =
            reponseJoueur[index] ? "#333" : "black";
        caseLettre.style.color = "white";
    });
}


/* =====================================================
   9. VIDER TOUTES LES CASES
===================================================== */
function viderCases() {
    reponseJoueur.forEach(function(item) {
        item.bouton.disabled = false;
    });
    const cases = document.querySelectorAll(".lettre");
    cases.forEach(function(caseLettre) {
        caseLettre.textContent = "_";
        caseLettre.style.backgroundColor = "black";
        caseLettre.style.color = "white";
        caseLettre.classList.remove("erreur", "succes");
    });
    reponseJoueur = [];
    verificationEnCours = false;
}


/* =====================================================
   10. ÉVÉNEMENTS DU CLAVIER ET DES CASES
===================================================== */
// Délégation d'événement sur le clavier
clavier.addEventListener("click", function(event) {
    const bouton = event.target.closest(".btn");
    if (!bouton) {
        return;
    }
    choisirLettre(bouton);
});
// Délégation d'événement sur les cases
casesReponse.addEventListener("click", function(event) {
    const bouton = event.target.closest(".lettre");
    if (!bouton) {
        return;
    }
    retirerLettre(Number(bouton.dataset.index));
});


/* =====================================================
   11. BOUTON EFFACER
===================================================== */
btnReset.addEventListener("click", function(event) {
    event.preventDefault();
    chargerNiveau(niveauCourant);
});


/* =====================================================
   12. NIVEAU SUIVANT
===================================================== */
btnSuivant.addEventListener("click", function() {
    if (niveauCourant < niveaux.length - 1) {
        chargerNiveau(niveauCourant + 1);
    }
});


/* =====================================================
   13. DÉMARRER LE JEU
===================================================== */
chargerNiveau(0);

<script>

let scoreMilan=0,scoreLiverpool=0;
let butsMilan=[],butsLiverpool=[];
let phase="arrete";

const $=classe=>document.querySelectorAll("."+classe);
const afficher=(classe,valeur)=>$(classe)[0].textContent=valeur;

const milan=[
{numero:2,nom:"Cafu"},{numero:3,nom:"Maldini"},
{numero:7,nom:"Shevchenko"},{numero:8,nom:"Gattuso"},
{numero:11,nom:"Crespo"},{numero:13,nom:"Nesta"},
{numero:20,nom:"Seedorf"},{numero:21,nom:"Pirlo"},
{numero:22,nom:"Kaka"},{numero:31,nom:"Stam"}
];

const liverpool=[
{numero:3,nom:"Finnan"},{numero:4,nom:"Hyypia"},
{numero:5,nom:"Baros"},{numero:6,nom:"Riise"},
{numero:7,nom:"Kewell"},{numero:8,nom:"Gerrard"},
{numero:10,nom:"Luis Garcia"},{numero:14,nom:"Xabi Alonso"},
{numero:21,nom:"Traore"},{numero:23,nom:"Carragher"}
];

const boutons=$("btn");

boutons.forEach((btn,index)=>{
btn.addEventListener("click",()=>{
if(index===0)Demarrer();
if(index===1)Pause();
if(index===2)AjouterButManuel("milan");
if(index===3)Reset();
if(index===4)AjouterButManuel("liverpool");
});
});

function ActualiserBoutons(){
const actifs=phase==="arrete"||phase==="pause"||phase==="miTemps"||phase==="prolongationPause";
boutons[0].classList.toggle("btnA",actifs);
boutons[1].classList.toggle("btnA",phase==="enCours"||phase==="prolongation");
boutons[2].classList.toggle("btnA",phase!=="termine");
boutons[3].classList.toggle("btnA",phase!=="arrete");
boutons[4].classList.toggle("btnA",phase!=="termine");
}

function AfficherTemps(){
afficher("temp",String(minute).padStart(2,"0")+" : "+String(seconde).padStart(2,"0"));
}

function possessionBall(){
let poss=Math.floor(Math.random()*21)+40;
$("pB")[0].textContent=poss;
$("pB")[1].textContent=100-poss;
}

function AfficherPopup(joueur,numero,equipe){
const popup=document.createElement("div");
Object.assign(popup.style,{
position:"fixed",top:"20px",left:"50%",
transform:"translateX(-50%)",
background:equipe==="milan"?"#ce2b37":"#1060c8",
color:"#fff",padding:"14px 28px",borderRadius:"8px",
fontFamily:"Barlow Condensed,sans-serif",
textTransform:"uppercase",zIndex:"9999",
textAlign:"center",boxShadow:"0 4px 24px #0008"
});
popup.innerHTML="<i class='fa-solid fa-futbol'></i> BUT ! "+(equipe==="milan"?"AC MILAN":"LIVERPOOL")+"<br>"+joueur+" ("+numero+") à la minute : "+minute;
document.body.appendChild(popup);
setTimeout(()=>popup.remove(),5000);
}

function EnregistrerBut(equipe,joueur){
const but={nom:joueur.nom,numero:joueur.numero,minute};
if(equipe==="milan"){
butsMilan.push(but);
afficher("dom",++scoreMilan);
}else{
butsLiverpool.push(but);
afficher("ext",++scoreLiverpool);
}
AfficherEvenements();
MettreAJourOnze("milan");
MettreAJourOnze("liverpool");
AfficherPopup(joueur.nom,joueur.numero,equipe);
}

function AjouterButManuel(equipe){
if(phase==="termine")return;
const joueurs=equipe==="milan"?milan:liverpool;
const joueur=joueurs[Math.floor(Math.random()*joueurs.length)];
EnregistrerBut(equipe,joueur);
}

function SimulerMatch(){
if(Math.random()<0.001){
const equipe=Math.random()<0.5?"milan":"liverpool";
const joueurs=equipe==="milan"?milan:liverpool;
const joueur=joueurs[Math.floor(Math.random()*joueurs.length)];
EnregistrerBut(equipe,joueur);
}
}

function AfficherEvenements(){
const zone=$("zoneEv")[0];
zone.innerHTML="";
const buts=[
...butsMilan.map(b=>({...b,equipe:"milan"})),
...butsLiverpool.map(b=>({...b,equipe:"liverpool"}))
].sort((a,b)=>a.minute-b.minute);

let premiere=false,deuxieme=false;

buts.forEach(but=>{
if(but.minute<=45&&!premiere){
zone.innerHTML+="<div class='ev miTemps'><span class='texteCenter'>— 1ère Mi-Temps —</span></div>";
premiere=true;
}
if(but.minute>45&&but.minute<=90&&!deuxieme){
zone.innerHTML+="<div class='ev miTemps'><span class='texteCenter'>— 2ème Mi-Temps —</span></div>";
deuxieme=true;
}
zone.innerHTML+=`
<div class="ev ${but.equipe}">
<span class="minuteEv">${but.minute}'</span>
<span class="iconeEv"><i class="fa-solid fa-futbol"></i></span>
<span class="texteEv">${but.nom} (${but.numero})</span>
<span class="equipeEv ${but.equipe==="milan"?"milans":"liverpools"}">${but.equipe==="milan"?"AC Milan":"Liverpool"}</span>
</div>`;
});
zone.scrollTop=zone.scrollHeight;
}

function MettreAJourOnze(equipe){
const buts=equipe==="milan"?butsMilan:butsLiverpool;
const tableau=equipe==="milan"?$("tabJ")[0]:$("tabJ")[1];
const compteur={};

buts.forEach(but=>{
if(!compteur[but.nom])compteur[but.nom]=[];
compteur[but.nom].push(but.minute);
});

tableau.querySelectorAll(".jr").forEach(ligne=>{
const nom=ligne.querySelector(".nomJ").textContent.replace(" (C)","").trim();
const span=ligne.querySelector(".butJ");
span.innerHTML=(compteur[nom]||[]).map(m=>`<i class="fa-solid fa-futbol"></i> ${m}'`).join(" ");
});
}

function AfficherStatut(texte){
afficher("valeur",texte);
}

function Demarrer(){
if(phase==="termine"||phase==="enCours"||phase==="prolongation")return;
phase=phase==="prolongationPause"?"prolongation":"enCours";
ActualiserBoutons();
AfficherStatut(phase==="prolongation"?"Prolongation":"Match en cours");

temps=setInterval(()=>{
seconde++;
if(seconde>=60){seconde=0;minute++}
AfficherTemps();
possessionBall();
SimulerMatch();

if(minute===45&&seconde===0){
phase="miTemps";
clearInterval(temps);
AfficherStatut("Mi-temps");
ActualiserBoutons();
return;
}

if(minute===90&&seconde===0){
tempsAdd=Math.floor(Math.random()*5)+1;
$(".add")[0].style.display="block";
$(".add")[0].textContent="+"+tempsAdd+" minutes";
AfficherStatut("Temps additionnel");
}

if(minute>=90+tempsAdd&&phase==="enCours"){
clearInterval(temps);
if(scoreMilan!==scoreLiverpool){
FinMatch();
}else{
phase="prolongationPause";
AfficherStatut("Fin du temps réglementaire");
afficher("pro","Après prolongations");
afficher("proR","Égalité — Prolongations");
$("pro")[0].style.display="block";
$("proR")[0].style.display="block";
ActualiserBoutons();
}
return;
}

if(phase==="prolongation"&&minute>=120){
clearInterval(temps);
FinMatch();
}
},100);
}

function FinMatch(){
phase="termine";
clearInterval(temps);
AfficherStatut("Fin du match");
$("victoire")[0].style.display="flex";
$("texteVictoire")[0].textContent=scoreMilan>scoreLiverpool
?"Le Milan gagne après prolongation"
:scoreLiverpool>scoreMilan
?"Liverpool gagne après prolongation"
:"Match nul — Tirs au but";
ActualiserBoutons();
}

function Pause(){
if(phase!=="enCours"&&phase!=="prolongation")return;
phase=phase==="prolongation"?"prolongationPause":"pause";
clearInterval(temps);
AfficherStatut("Match en pause");
ActualiserBoutons();
}

function Reset(){
clearInterval(temps);
minute=0;
seconde=0;
tempsAdd=0;
scoreMilan=0;
scoreLiverpool=0;
butsMilan=[];
butsLiverpool=[];
phase="arrete";

AfficherTemps();
afficher("valeur","Démarrer le match");
afficher("dom",0);
afficher("ext",0);

$(".add")[0].style.display="none";
$(".add")[0].textContent="";
$(".zoneEv")[0].innerHTML="";
$(".pB")[0].textContent=50;
$(".pB")[1].textContent=50;
$(".victoire")[0].style.display="none";
$(".pro")[0].style.display="none";
$(".proR")[0].style.display="none";

document.querySelectorAll(".butJ").forEach(el=>el.innerHTML="");
ActualiserBoutons();
}

ActualiserBoutons();
</script>

</body>
</html> -->

// Un décorateur permet d'ajouter un comportement
// à une méthode sans modifier directement son code.
function journaliser(methode, contexte) {

    return function (...args) {

        console.log(`Exécution de : ${contexte.name}`);

        // Exécute la méthode originale.
        return methode.call(this, ...args);
    };
}

class Personne {

    // Attribut privé : accessible uniquement dans la classe.
    #nom;

    constructor(nom, age) {
        this.#nom = nom;
        this.age = age;

    get nom() {
        return this.#nom;
    }

    // Setter
    set nom(nouveauNom) {
        this.#nom = nouveauNom;
    }

    // Méthode avec décorateur.

}
